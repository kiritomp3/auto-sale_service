name: Build, Push and Deploy

on:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/kiritomp3/auto-sale_service
  API_CONTAINER_NAME: auto-sale_service
  REDIS_CONTAINER_NAME: auto-sale-redis
  NETWORK_NAME: auto-sale-network
  REDIS_VOLUME_NAME: auto-sale-redis-data

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: Deploy on server
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            docker pull ghcr.io/kiritomp3/auto-sale_service:latest
            docker pull redis:7-alpine

            docker network create ${{ env.NETWORK_NAME }} || true

            docker stop ${{ env.API_CONTAINER_NAME }} ${{ env.REDIS_CONTAINER_NAME }} || true
            docker rm ${{ env.API_CONTAINER_NAME }} ${{ env.REDIS_CONTAINER_NAME }} || true

            docker volume create ${{ env.REDIS_VOLUME_NAME }} || true
            docker run -d \
              --name ${{ env.REDIS_CONTAINER_NAME }} \
              --network ${{ env.NETWORK_NAME }} \
              --restart unless-stopped \
              -v ${{ env.REDIS_VOLUME_NAME }}:/data \
              redis:7-alpine

            docker run -d \
              --name ${{ env.API_CONTAINER_NAME }} \
              --network ${{ env.NETWORK_NAME }} \
              --restart unless-stopped \
              -p 127.0.0.1:18000:8000 \
              --env-file /root/auto-sale_service/.env \
              -e REDIS_URL=redis://${{ env.REDIS_CONTAINER_NAME }}:6379/0 \
              ghcr.io/kiritomp3/auto-sale_service:latest
